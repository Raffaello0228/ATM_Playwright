[project]
name = "atm-playwright"
version = "0.1.0"
description = "AI Agent automated testing framework using playwright-mcp + Langfuse"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]
